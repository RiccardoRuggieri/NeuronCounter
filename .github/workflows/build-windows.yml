name: Build Windows App

# Triggers:
#   - Every push to main
#   - Manually from the GitHub Actions tab ("Run workflow" button)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required so the workflow can create the Release + tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build NeuronCounter.exe
        run: pyinstaller model.spec --clean --noconfirm

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuronCounter-Windows
          path: dist/NeuronCounter.exe
          retention-days: 90

      # ---- Create / update a GitHub Release so there's always a download link ----
      - name: Get current date for release tag
        id: date
        run: echo "tag=build-$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release with exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.tag }}
          name: "Neuron Counter — Windows build"
          body: |
            ## How to use

            1. Download **NeuronCounter.exe** below.
            2. Double-click it — no install needed.
            3. Click **"Select image…"**, pick a `.czi` file, and the app runs.

            > First launch takes ~5–10 seconds while it unpacks; after that it is instant.
          files: dist/NeuronCounter.exe
          make_latest: true
